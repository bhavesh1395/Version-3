name: Build Smooth APK (Final)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        # REMOVED cache: 'npm' to fix your "Lock file not found" error

    - name: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Build Web App
      run: npm run build
      env:
        NODE_ENV: production

    - name: Setup Capacitor (Create Android App)
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "My AI App" "com.aiapp.shiksha" --web-dir=dist
        npx cap add android
        
        # Optimization: Enable hardware acceleration for smooth 60fps
        sed -i 's/<\/application>/    <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
        
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Fix Gradle Permissions
      # This points to the correct folder created by Capacitor
      run: chmod +x android/gradlew

    - name: Build APK
      run: |
        cd android
        ./gradlew clean assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: final-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
