name: Build APK (Universal Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: 📦 UNZIP and FIX Folder Structure
      run: |
        echo "--- Step 1: Check for ZIP files ---"
        # Find any zip file in the root
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
             echo "Found ZIP file: $ZIP_FILE"
             echo "Unzipping..."
             unzip -q "$ZIP_FILE"
             rm "$ZIP_FILE"
        else
             echo "No ZIP file found. Checking for folders..."
        fi
        
        echo "--- Step 2: Hunt for package.json ---"
        # Find package.json up to 4 folders deep
        PKG_PATH=$(find . -maxdepth 4 -name package.json -not -path "*/node_modules/*" | head -n 1)
        
        if [ -z "$PKG_PATH" ]; then
             echo "❌ ERROR: No package.json found. Here is the full file list:"
             ls -R
             exit 1
        fi
        
        echo "✅ Found package.json at: $PKG_PATH"
        
        # Move files if they are in a subfolder
        PROJECT_DIR=$(dirname "$PKG_PATH")
        
        if [ "$PROJECT_DIR" != "." ]; then
             echo "Moving project files to root directory..."
             cp -r "$PROJECT_DIR"/* .
             cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Build Web App (Production Mode)
      run: npm run build
      env:
        NODE_ENV: production

    - name: Setup Capacitor and Android
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "My AI App" "com.aiapp.shiksha" --web-dir=dist
        npx cap add android
        
        # Optimization: Enable hardware acceleration for 60FPS smoothness
        sed -i 's/<\/application>/    <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
        
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Fix Gradle Permissions
      run: chmod +x android/gradlew

    - name: Build APK
      run: |
        cd android
        ./gradlew clean assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: universal-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
