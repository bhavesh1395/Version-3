name: Build APK (No Daemon Fix)
name: Build APK (Kotlin Fix)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Fast Checkout
      uses: actions/checkout@v4

    - name: ⚡ Fix Files & Clean Up
      run: |
        # 1. Unzip
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
             echo "Unzipping $ZIP_FILE..."
             unzip -q "$ZIP_FILE"
             rm "$ZIP_FILE"
        fi

        # 2. DELETE node_modules
        find . -name "node_modules" -type d -prune -exec rm -rf '{}' +

        # 3. Move files to root
        PKG_PATH=$(find . -maxdepth 4 -name package.json | head -n 1)
        if [ -n "$PKG_PATH" ]; then
             PROJECT_DIR=$(dirname "$PKG_PATH")
             if [ "$PROJECT_DIR" != "." ]; then
                  echo "Moving files to root..."
                  cp -r "$PROJECT_DIR"/* .
                  cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
             fi
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Build Web App
      run: npm run build
      env:
        NODE_ENV: production

    - name: Setup Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "My AI App" "com.aiapp.shiksha" --web-dir=dist
        npx cap add android
        # Hardware Acceleration
        sed -i 's/<\/application>/    <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
        npx cap sync android

    # === THIS IS THE NEW FIX ===
    - name: 🚑 Fix Kotlin Conflict (Duplicate Class Error)
      run: |
        cd android/app
        echo "Applying resolution strategy to build.gradle..."
        # This appends a rule to FORCE everyone to use the same Kotlin version
        echo '
        configurations.all {
            resolutionStrategy {
                force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
            }
        }
        ' >> build.gradle

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'zulu'

    - name: Build APK (No Daemon)
      run: |
        chmod +x android/gradlew
        cd android
        # Build without starting a background daemon
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx2560m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: my-final-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
