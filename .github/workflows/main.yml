name: Fast Build (Anti-Hang)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # Auto-kills if it gets stuck again

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: ⚡ Fix Heavy Files & Folder Structure
      run: |
        echo "--- Step 1: Handle ZIPs ---"
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
             echo "Unzipping $ZIP_FILE..."
             unzip -q "$ZIP_FILE"
             rm "$ZIP_FILE"
        fi

        echo "--- Step 2: DELETE node_modules (The cause of the lag) ---"
        # We delete this to prevent the 25-minute hang
        find . -name "node_modules" -type d -prune -exec rm -rf '{}' +
        echo "✅ Heavy folders removed."

        echo "--- Step 3: Move Project to Root ---"
        # Find package.json again
        PKG_PATH=$(find . -maxdepth 4 -name package.json | head -n 1)
        
        if [ -z "$PKG_PATH" ]; then
             echo "❌ No package.json found."
             exit 1
        fi
        
        PROJECT_DIR=$(dirname "$PKG_PATH")
        if [ "$PROJECT_DIR" != "." ]; then
             echo "Moving files from $PROJECT_DIR to root..."
             cp -r "$PROJECT_DIR"/* .
             cp -r "$PROJECT_DIR"/.* . 2>/dev/null || true
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies (Fresh)
      run: npm install --no-audit --no-fund

    - name: Build Web App
      run: npm run build
      env:
        NODE_ENV: production

    - name: Setup Capacitor
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "My AI App" "com.aiapp.shiksha" --web-dir=dist
        npx cap add android
        # Optimization for speed
        sed -i 's/<\/application>/    <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Build APK (Fast Mode)
      run: |
        chmod +x android/gradlew
        cd android
        # Removed "clean" to make it faster
        ./gradlew assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fast-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
