name: Build APK (Auto-Fix Zip)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # === THIS IS THE NEW MAGIC STEP ===
    - name: 📂 Auto-Fix "Zip Folder" Mistake
      run: |
        # This searches for where package.json is hiding
        echo "Searching for project files..."
        PROJECT_ROOT=$(find . -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -n 1 | xargs dirname)
        
        if [ -z "$PROJECT_ROOT" ] || [ "$PROJECT_ROOT" == "." ]; then
          echo "Files are already in the root, or no package.json found."
        else
          echo "✅ Found project hiding in: $PROJECT_ROOT"
          echo "Moving files to the main folder..."
          mv "$PROJECT_ROOT"/* .
          mv "$PROJECT_ROOT"/.* . 2>/dev/null || true
        fi

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install --no-audit --no-fund

    - name: Build Web App
      run: npm run build
      env:
        NODE_ENV: production

    - name: Setup Capacitor (Create Android App)
      run: |
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init "My AI App" "com.aiapp.shiksha" --web-dir=dist
        npx cap add android
        
        # Optimization: Enable hardware acceleration
        sed -i 's/<\/application>/    <meta-data android:name="android.webkit.WebView.EnableSafeBrowsing" android:value="false" \/>\n    <\/application>/' android/app/src/main/AndroidManifest.xml
        
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Fix Gradle Permissions
      run: chmod +x android/gradlew

    - name: Build APK
      run: |
        cd android
        ./gradlew clean assembleDebug -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: final-app-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
